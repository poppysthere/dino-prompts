cat:
  - id: cat-happy
    note: "cat -> meow -> answer -> close"
    turns: ["cat!", "meow meow!", "yes"]
    max_replies: 4

  - id: cat-meaning-retry
    note: "Meaning question answered first, then one clear retry"
    turns: ["What is a cat?", "cat", "meow", "no"]
    max_replies: 5
    reply_require:
      "2": ["^A cat is a small pet\\.", "Let's try again"]

  - id: cat-old-word
    note: "Earlier word is acknowledged without fake cat praise"
    turns: ["cow", "cat", "meow", "no"]
    max_replies: 5
    reply_require:
      "2": ["^Yes, cow was first\\. This is cat\\."]
    reply_forbid:
      "2": ["Yes, cat"]

  - id: cat-silent
    note: "Full silence moves forward with no fake praise"
    turns: []
    max_replies: 5
    forbid_phrases: ["you got it", "great job", "amazing"]

  - id: cat-name-question-after-retry
    note: "Question after the one retry is answered before moving to meow"
    turns: ["okay", "What's your name?", "meow", "no"]
    teacher_name: "Kim"
    max_replies: 5
    reply_require:
      "3": ["^I'm Kim\\.", "A cat says meow meow"]
    reply_forbid:
      "3": ["Let's try again"]

  - id: cat-dog-after-meow
    note: "Dog question is answered before the cake question"
    turns: ["cat", "Do you like my dog?", "no"]
    max_replies: 4
    reply_require:
      "3": ["^Yes, I like dogs\\.", "Now, let's look at the cat\\.", "Does the cat have the cake"]
    reply_forbid:
      "3": ["Meow meow"]

  - id: cat-weather-at-close
    note: "Weather question is answered before finishing"
    turns: ["cat", "meow", "How's the weather?"]
    max_replies: 4
    reply_require:
      "4": ["^I can't see the sky\\.", "Let's keep looking"]

  - id: cat-blind-food
    note: "BLIND CASE: teacher answers a new safe personal question"
    turns: ["What food do you like?", "cat", "meow", "no"]
    max_replies: 5
    reply_require:
      "2": ["^I like [A-Za-z]+", "Let's try again"]
