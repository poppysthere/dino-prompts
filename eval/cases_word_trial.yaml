# Case battery — 新手引导体验课 trial demo, word pages: HEDGEHOG + FLAMINGO.
# Ages 4-6, pre-A1. The reveal VIDEO played before each page: the teacher faces
# the animal, never re-opens the door (device #368306). Structure: MEET (call
# carries the model: word, parts, word — ends on the whole word) -> celebrate +
# wonder OR retry -> wonder -> close. The clap-along is retired (user doctrine:
# clapping and speaking at once is too hard at 4).
# Flamingo extras: the beats are three REAL words (Flam. In. Go. — TTS garbles
# made-up chunks like "Fla", device #369924), the giraffe (the third shadow) is
# a live secret, and the close hands to the hedgehog+flamingo practice game.
# Run: python3 eval/run_word_trial.py

word_trial_hedgehog:
  - id: hh-pass
    note: happy path — whole word, celebrate + wonder, close (3 replies)
    turns:
      - "Hedgehog!"
      - "yes!"
    require_phrases:
      - "hedge\\W+hog\\W+hedgehog"     # the model, ending on the whole word
      - "(good job|well done|yes|wow)" # real, kid-sized celebration

  - id: hh-word-again
    note: "REGRESSION (device #375239): the wonder went out, the child said
      'Hedgehog.' again — that is their ANSWER; the reply is the CLOSE, never
      celebration plus the wonder re-asked"
    turns:
      - "Hedgehog."
      - "Hedgehog."

  - id: hh-mishear-loop
    note: "REGRESSION (device): the child's echo tries were misheard as '嗨，纸' /
      '纸号' and the SAME retry ('Hi hi! Look at him! One more time...') went out
      FIVE times word for word. Mishears are tries: nod + retry once, then nod +
      the WONDER, then the close — the count never freezes"
    turns:
      - "嗨，纸。"
      - "嗨。"
      - "嗨，纸号。"
    require_phrases:
      - "do you like|is he (big|small)"

  - id: hh-confused-close
    note: "REGRESSION (device #375560): the wonder's answer is confusion
      ('什么意思？听不懂。') — the close gives the MEANING (a little spiky
      friend), with comfort and NO praise: 'Good job! Well done!' at a lost
      child says they were not heard"
    turns:
      - "Hedgehog."
      - "嗯，你不知道什么意思。"
    require_phrases:
      - "(spiky|friend|little)"
    # praise-in-close is banned by the checker's praise-at-confusion rule;
    # a case-level forbid would wrongly hit reply 2's honest celebration

  - id: hh-guessed-before
    note: the child guessed the hedgehog in the lead-in — the reveal is THEIR win
    seed:
      - role: assistant
        text: "Oh! Ding dong! Someone is at the door! A shadow! Who is it? A cat? A dog? Guess![STUDENT_TALK]"
      - role: user
        text: "刺猬！"
      - role: assistant
        text: "A hedgehog? Ooh! Maybe! Hmm! Is it big, or small?[STUDENT_TALK]"
      - role: user
        text: "small!"
      - role: assistant
        text: "Small? Tiny tiny! Ha ha! Let's open the door! Come on![TEMPLATE_FINISH]"
    turns:
      - "Hedgehog!"
      - "yes!"
    require_phrases:
      - "(you said it|you were right|you got it|you knew|you guessed)"

  - id: hh-piece
    note: real device shape (#368310) — "Had." is a PIECE; echo their sound, then the ladder
    turns:
      - "Had."
      - "Hedgehog!"
      - "yes!"
    require_phrases:
      - "(had|so close|almost)"   # their sound comes back, honestly
      - "one more time"           # the ladder retry, not fake full-word praise

  - id: hh-greet-mid
    note: device #368308 — child says Hi after the meet call; greet tiny, never re-read reply 1
    turns:
      - "Hi."
      - "hedgehog"
      - "yes"
    forbid_phrases:
      - "say it with me"

  - id: hh-cn-word
    note: own-language word means they understood — recast to English, then the ladder
    turns:
      - "刺猬！"
      - "hedgehog"
      - "yes"
    require_phrases:
      - "in english"

  - id: hh-agreement
    note: 好 is agreement, not a try — no praise, run the ladder
    turns:
      - "好。"
      - "hedgehog"
      - "yes!"

  - id: hh-question
    note: "child asks what it is — answer by showing, never 'means', then the ladder"
    turns:
      - "这是什么呀？"
      - "hedge hog"
      - "小小的。"

  - id: hh-scared
    note: spikes are scary — soft catch first, he is a friend, gentle ladder still comes
    turns:
      - "有刺！我怕！"
      - "hedgehog"
      - "yes"
    require_phrases:
      - "friend"

  - id: hh-optout
    note: opt-out at the meet call is sacred — no more asks, wonder, close
    turns:
      - "我不想说了。"
      - "嗯。"

  - id: hh-silent
    note: fully silent page — exactly 4 replies, no fake praise
    turns: []
    forbid_phrases:
      - "good job"
      - "great job"

  - id: hh-junk-name
    note: junk default name is never spoken
    student_name: "test_user"
    turns:
      - "Hedgehog!"
      - "yes"
    forbid_phrases:
      - "test_user"

word_trial_flamingo:
  - id: fl-pass
    note: happy path — whole word, celebrate + wonder, close (3 replies)
    turns:
      - "Flamingo!"
      - "yes!"
    require_phrases:
      - "flam\\W+in\\W+go\\W+flamingo" # the model, ending on the whole word
      - "(good job|well done|yes|wow)" # real, kid-sized celebration

  - id: fl-word-again
    note: "sister regression of device #375239: the word said again after the
      wonder is its ANSWER — the reply is the CLOSE, no re-ask"
    turns:
      - "Flamingo."
      - "Flamingo."

  - id: fl-claims-win
    note: the child guessed flamingo in the bridge game and now claims it — hand them the win, then the ladder
    seed:
      - role: assistant
        text: "The hedgehog is IN! But look![TEACHER_POINT_TO_SCREEN] ANOTHER shadow! Who is it THIS time? Guess![STUDENT_TALK]"
      - role: user
        text: "火烈鸟！"
      - role: assistant
        text: "A flamingo? Ooh! Maybe! Is it tall, or short?[STUDENT_TALK]"
      - role: user
        text: "Tall!"
      - role: assistant
        text: "Tall? Ooh! Maybe! Let's watch! Come on![NEXT_STEP]"
      - role: assistant
        text: "The door opened! A FLAMINGO![TEACHER_APPLAUD] WOW! So pink! But look![TEACHER_POINT_TO_SCREEN] A NEW shadow! Who is it?[STUDENT_TALK]"
      - role: user
        text: "A cat!"
      - role: assistant
        text: "A cat? Ooh! Maybe! We don't know yet! But we know the FLAMINGO! Let's look at her first! Come on![TEMPLATE_FINISH]"
    turns:
      - "我说对了！我说的火烈鸟！"
      - "Flamingo!"
      - "yes!"
    require_phrases:
      - "(you said it|you were right|you knew|you guessed|good ears)"

  - id: fl-beat
    note: '"Go!" is a ladder beat — echo THEIR beat, then the ladder builds the rest'
    turns:
      - "Go!"
      - "Flamingo!"
      - "yes!"
    require_phrases:
      - "one more time"           # the ladder retry, not fake full-word praise

  - id: fl-half-chunk
    note: '"Mingo!" is a made-up chunk — praise the try but NEVER echo it (broken sound)'
    turns:
      - "Mingo!"
      - "Flamingo!"
      - "yes!"
    require_phrases:
      - "(so close|almost)"

  - id: fl-mishear
    note: 'device #369927 — ASR turned their try into "Good morning. Hello, hello.";
      warm tiny nod, redirect via the retry, and NEVER a third ask (the device ran
      "One more time" twice)'
    turns:
      - "Good morning. Hello, hello."
      - "Hello, me."
      - "Flamingo."
    require_phrases:
      - "(hello|morning|ha ha)"   # the nod — a person answers a greeting-shaped sound

  - id: fl-cn-word
    note: own-language word means they understood — recast to English, then the ladder
    turns:
      - "火烈鸟！"
      - "flamingo"
      - "yes"
    require_phrases:
      - "in english"

  - id: fl-door-question
    note: the child asks who is behind the door — the giraffe stays secret, tiny true answer
    turns:
      - "门后面是谁呀？"
      - "flamingo"
      - "yes"
    forbid_phrases:
      - "giraffe"
      - "长颈鹿"
    require_phrases:
      - "(do(n't| not) know|not yet)"

  - id: fl-agreement
    note: 好 is agreement, not a try — no praise, run the ladder
    turns:
      - "好。"
      - "flamingo"
      - "yes!"

  - id: fl-optout
    note: opt-out at the meet call is sacred — no more asks, wonder, close
    turns:
      - "我不想说了。"
      - "嗯。"

  - id: fl-silent
    note: fully silent page — exactly 4 replies, no fake praise
    turns: []
    forbid_phrases:
      - "good job"
      - "great job"

  - id: fl-junk-name
    note: junk default name is never spoken
    student_name: "test_user"
    turns:
      - "Flamingo!"
      - "yes"
    forbid_phrases:
      - "test_user"
