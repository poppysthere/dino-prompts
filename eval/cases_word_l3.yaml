    note: "REGRESSION CLASS (prod #358147): previous page's chat sits above -> after UI-ready the first reply is the ASK, never a close or praise for a child who hasn't spoken"
    seed:
      - role: assistant
        text: "Jump! YES! Great job, tom![TEACHER_APPLAUD] One, two, three! Let's jump with Dino and Mia! Jump, jump, jump! Over we go![TEACHER_JUMP][TEMPLATE_FINISH]"
    turns: ["Fly!"]
    require_phrases: ["well done"]
