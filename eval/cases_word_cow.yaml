cow:
  - id: cow-happy
    note: "cow -> moo -> answer -> close"
    turns: ["cow!", "moo moo!", "yes"]
    max_replies: 4

  - id: cow-meaning-retry
    note: "Meaning question answered first, then one clear retry"
    turns: ["What is a cow?", "cow", "moo", "no"]
    max_replies: 5
    reply_require:
      "2": ["^A cow is a big farm animal\\.", "Let's try again"]

  - id: cow-own-language
    note: "Understanding in another language gets credit but still one English try"
    turns: ["奶牛！", "cow", "哞哞！", "no"]
    max_replies: 5
    reply_require:
      "2": ["^Yes, you know the animal!"]

  - id: cow-silent
    note: "Full silence moves forward with no fake praise and one retry only"
    turns: []
    max_replies: 5
    forbid_phrases: ["you got it", "great job", "amazing"]

  - id: cow-name-question
    note: "Teacher answers their name before the retry"
    turns: ["What's your name?", "cow", "moo", "no"]
    teacher_name: "Kim"
    max_replies: 5
    reply_require:
      "2": ["^I'm Kim\\.", "Let's try again"]

  - id: cow-dog-after-moo-invite
    note: "Personal question after the sound invite is answered before the cake question"
    turns: ["cow", "Do you like my dog?", "no"]
    max_replies: 4
    reply_require:
      "3": ["^Yes, I like dogs!", "Does the cow have the cake"]

  - id: cow-weather-at-close
    note: "Question at the final beat is answered before finishing"
    turns: ["cow", "moo", "How's the weather?"]
    max_replies: 4
    reply_require:
      "4": ["^I can't see the sky\\.", "Let's keep looking"]

  - id: cow-blind-color
    note: "BLIND CASE: unlisted personal question still gets a direct answer"
    turns: ["What's your favorite color?", "cow", "moo", "no"]
    max_replies: 5
    reply_require:
      "2": ["^(?:My favorite color is|I like) (?:blue|red|green|yellow|pink|purple)", "Let's try again"]

  - id: cow-how-asr
    note: "ASR How after a cow prompt counts as cow, not a question"
    turns: ["How?", "moo", "no"]
    max_replies: 4
    reply_forbid:
      "2": ["Let's try again"]
