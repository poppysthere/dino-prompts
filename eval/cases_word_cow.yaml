# Case battery for the L2 cow word page (inside Mouse's cake mystery).
# Shape: MEET -> try (max 1 retry) -> moo -> wonder -> close. 4-5 teacher replies.
# No [WORD_EVALUATION] anywhere; waits are [TEACHER_LISTEN][STUDENT_TALK].

cow:
  - id: cow-happy
    note: "fast path: cow -> moo -> guesses the cow -> neutral close (no confirm), 4 replies"
    turns: ["cow!", "moo moo!", "the cow ate it!"]
    max_replies: 4
  - id: cow-retry-pass
    note: "confused first ('what is cow?') -> catch + ONE retry -> pass -> moo -> close; 5 replies"
    turns: ["什么是cow呀？", "cow", "moo", "ok"]
    max_replies: 5
  - id: cow-l1-word
    note: "own-language cow word does NOT count as the English try (catch must credit the knowing); moo in own language DOES count (a moo is a moo); horse guess at the wonder must not leak"
    turns: ["奶牛！", "cow", "哞哞！", "马吃的！"]
    max_replies: 5
  - id: cow-silent-all
    note: "full silence: script rides forward, one retry only, funny-sound row, close with no catch; 5 replies, no fake praise"
    turns: []
    max_replies: 5
    forbid_phrases: ["you got it", "amazing"]
  - id: cow-offtopic
    note: "child talks about their dog instead: catch it in one sentence, retry once, keep the script shape"
    turns: ["I have a dog! Woof!", "kao", "moo", "I don't know"]
    max_replies: 5
  - id: cow-agree-no
    note: "REGRESSION (prod 2026-07-13 #352593): '好。' is agreement, NOT a cow try — no fake 'you got it'; and 'No.' to the wonder must be sided with ('No? Ha ha, okay!'), never answered with 'maybe'"
    turns: ["好。", "cow", "moo moo", "No."]
    forbid_phrases: ["\\bmaybe\\b"]
    reply_forbid:
      2: ["you got it", "yes! cow"]
    require_phrases: ["\\bno\\b"]
    max_replies: 5
  - id: cow-word-again-idk
    note: "parity with cat regression: child says 'Cow.' at the moo invite (practicing) — praise the COW, no fake 'real cows'/'funny sound'; 'I don't know, what do you think?' at the wonder gets answered, never 'maybe'"
    turns: ["cow!", "Cow.", "我也不知道，你觉得呢？"]
    reply_forbid:
      3: ["real cows", "i love it", "funny sound"]
    forbid_phrases: ["\\bmaybe\\b"]
    max_replies: 4
  - id: cow-junkname
    note: "JUNK NAME: placeholder studentName is never spoken; name slots drop cleanly"
    turns: ["cow!", "moo!", "yes"]
    student_name: "test_user"
    forbid_phrases: ["test[_\\s]?user"]
    max_replies: 4

  # REGRESSION (prod 2026-07-14 #7680580001): child said cow, ASR wrote "How?" — six retry
  # loops fired. "How?" after a say-it call IS cow; retry happens once, ever.
  - id: cow-how-asr
    note: "Lisa's class replay: 什么→retry, How?=cow celebrate, moo, lone 知道 = truncated 不知道"
    turns:
      - "嗯。 什么？"
      - "How?"
      - "哞哞！"
      - "知道。"
    max_replies: 5
    reply_forbid:
      "3": ["one more time", "let's go together"]
      "5": ["know\\. ?ha", "\\bmaybe\\b"]
    require_phrases: ["don't know too"]

  # REGRESSION (same class): agreement then "How?" — forward only, never a second retry
  - id: cow-how-loop
    note: "什么→retry, 好=agreement rides beat 3, How? at moo invite = practicing the word"
    turns:
      - "什么？"
      - "好。"
      - "How?"
      - "不知道。"
    max_replies: 5
    reply_forbid:
      "3": ["one more time", "let's go together"]
      "4": ["one more time", "real cows", "funny sound"]

