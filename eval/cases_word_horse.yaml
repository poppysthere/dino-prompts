horse:
  - id: horse-happy
    note: "horse -> neigh -> horse guess -> neutral close"
    turns: ["horse!", "neigh neigh!", "the horse!"]
    max_replies: 4
    forbid_phrases: ["the horse ate", "yes[^.!?]*horse[^.!?]*cake"]

  - id: horse-house-asr
    note: "ASR house counts as a horse try"
    turns: ["house", "neigh", "no"]
    max_replies: 4
    reply_forbid:
      "2": ["Let's try again"]

  - id: horse-of-course-asr
    note: "ASR of course counts as horse, not agreement"
    turns: ["of course", "neigh", "no"]
    max_replies: 4
    reply_forbid:
      "2": ["Let's try again"]

  - id: horse-meaning-retry
    note: "Meaning question answered before one retry"
    turns: ["What is a horse?", "horse", "neigh", "no"]
    max_replies: 5
    reply_require:
      "2": ["^A horse is a big animal\\.", "Let's try again"]

  - id: horse-nainai-asr
    note: "奶奶 counts as a neigh sound"
    turns: ["horse", "奶奶。", "no"]
    max_replies: 4
    reply_require:
      "3": ["^Neigh neigh! You sound like a horse!"]

  - id: horse-silent
    note: "Full silence moves forward with one retry and no fake praise"
    turns: []
    max_replies: 5
    forbid_phrases: ["you got it", "great job", "amazing"]

  - id: horse-name-question
    note: "Name question is answered before the retry"
    turns: ["What's your name?", "horse", "neigh", "no"]
    teacher_name: "Kim"
    max_replies: 5
    reply_require:
      "2": ["^I'm Kim\\.", "Let's try again"]

  - id: horse-dog-after-neigh
    note: "Dog question is answered before the cake question"
    turns: ["horse", "Do you like my dog?", "no"]
    max_replies: 4
    reply_require:
      "3": ["^Yes, I like dogs\\.", "Now, let's look at the horse\\.", "Does the horse have the cake"]
    reply_forbid:
      "3": ["Neigh neigh"]

  - id: horse-weather-at-close
    note: "Weather question is answered before the page closes"
    turns: ["horse", "neigh", "How's the weather?"]
    max_replies: 4
    reply_require:
      "4": ["^I can't see the sky\\.", "Let's watch and find out"]

  - id: horse-blind-game
    note: "BLIND CASE: unlisted safe question receives a direct answer"
    turns: ["What game do you like?", "horse", "neigh", "no"]
    max_replies: 5
    reply_require:
      "2": ["^I like [A-Za-z]+", "Let's try again"]
