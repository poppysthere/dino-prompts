# Experimental L2 cat cases. One language bridge is allowed only after a real
# comprehension block and only in the configured support language.

cases:
  - id: lowercase-chinese-opening
    support_language: chinese
    turns: ["cat", "meow", "no"]
    max_replies: 4
    bridge: forbidden

  - id: first-silence-needs-child-friendly-instruction
    support_language: Chinese
    turns: ["", "cat", "meow", "yes"]
    max_replies: 5
    bridge: required
    bridge_script: cjk
    bridge_job: first_silence_clarity
    bridge_reply: 2

  - id: arabic-first-silence-needs-instruction
    support_language: Arabic
    turns: ["", "cat", "meow", "yes"]
    max_replies: 5
    bridge: required
    bridge_script: arabic
    bridge_job: first_silence_clarity
    bridge_reply: 2

  - id: confused-then-english-works
    support_language: Chinese
    turns: ["What?", "cat", "meow", "no"]
    max_replies: 5
    bridge: optional
    bridge_script: cjk

  - id: chinese-bridge-works
    support_language: Chinese
    turns: ["要做什么？", "cat", "meow", "I don't know"]
    max_replies: 5
    bridge: required
    bridge_script: cjk
    bridge_job: instruction
    bridge_reply: 2

  - id: chinese-meaning-bridge
    support_language: Chinese
    turns: ["cat是什么意思？", "cat", "meow", "no"]
    max_replies: 5
    bridge: required
    bridge_script: cjk
    bridge_job: meaning
    bridge_reply: 2

  - id: correct-local-meaning-is-not-stuck
    support_language: Chinese
    turns: ["小猫！", "cat", "meow", "no"]
    max_replies: 5
    bridge: forbidden

  - id: approximate-cat-is-not-stuck
    support_language: Chinese
    turns: ["kat", "meow", "no"]
    max_replies: 4
    bridge: forbidden

  - id: previous-cow-is-not-cat
    support_language: Chinese
    turns: ["cow", "cat", "meow", "no"]
    max_replies: 5
    bridge: forbidden

  - id: arabic-bridge-works
    support_language: Arabic
    turns: ["ماذا أفعل؟", "cat", "meow", "no"]
    max_replies: 5
    bridge: required
    bridge_script: arabic
    bridge_job: instruction
    bridge_reply: 2

  - id: no-configured-language
    support_language: none
    turns: ["What?", "I don't understand", "", "no"]
    max_replies: 3
    bridge: forbidden
    rescue_exit: true

  - id: no-configured-language-chinese-help
    support_language: none
    turns: ["要做什么？", "cat", "meow", "no"]
    max_replies: 5
    bridge: required
    bridge_script: cjk
    bridge_job: instruction
    bridge_reply: 2

  - id: no-configured-language-chinese-meaning
    support_language: none
    turns: ["cat是什么意思？", "cat", "meow", "no"]
    max_replies: 5
    bridge: required
    bridge_script: cjk
    bridge_job: meaning
    bridge_reply: 2

  - id: chinese-meow-meaning
    support_language: Chinese
    turns: ["cat", "什么是meow meow？", "meow meow", "no"]
    max_replies: 5
    bridge: required
    bridge_script: cjk
    bridge_job: meow_meaning
    bridge_reply: 3

  - id: chinese-meaning-still-confused-then-wonder-confused
    support_language: Chinese
    turns: ["Cat 是什么意思？", "什么？听不懂。", "I don't know.", "什么？", "no"]
    max_replies: 3
    bridge: required
    bridge_script: cjk
    bridge_job: rescue_exit
    bridge_replies: [2, 3]
    rescue_exit: true

  - id: child-help-overrides-word-goal
    support_language: none
    turns: ["Yup. 什么呀？", "我不懂。我不会说。"]
    max_replies: 3
    bridge: required
    bridge_script: cjk
    bridge_job: rescue_exit
    bridge_replies: [2, 3]
    rescue_exit: true

  - id: exact-log-context-sensitive-help
    support_language: none
    turns: ["", "我不懂。", "No phone. 去哪儿？", "嗯，呃，cat。", "什么意思？", "我不会说。你能说慢点？", "meow", "no"]
    max_replies: 9
    bridge: required
    bridge_script: cjk
    bridge_job: contextual_help_flow
    bridge_replies: [3, 4, 6, 7]

  - id: what-to-do-after-cat-and-meow
    support_language: Chinese
    turns: ["cat", "meow", "你要干什么？", "yes"]
    max_replies: 5
    bridge: required
    bridge_script: cjk
    bridge_job: current_personal_direction
    bridge_reply: 4
