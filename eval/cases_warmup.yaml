# Case battery for the Warm Up template family (L2 lesson0 state machine).
# SHORTENED 2026-07-13 (retention data: kids quit before the video):
# path A = 3 beats (name -> happy -> close), path B = 2 beats (happy -> close).
# No age question, no separate ready-wait. Silence ladder is 2 rungs.
# Turns are the scripted child inputs, in order; the runner injects silence
# messages when the script runs out.

path_a:  # first meeting — teacher must introduce herself and ask the name.
  # spoken_name/spoken_name_l1 arm the checker's name-mix + stale-name rules:
  # once the child states a name, the profile default must never be heard again.
  - id: a-happy-path
    note: "name -> happy -> close; expect exactly 3 beats ending TEMPLATE_FINISH, no age/ready question"
    spoken_name: tom
    turns: ["Tom", "yes!"]
  - id: a-sad-kid
    note: "sad answer -> close must catch the feeling + small ritual, not celebrate"
    spoken_name: tom
    turns: ["Tom", "no. sad."]
  - id: a-l1-name
    note: "child gives name inside L1 sentence (name-mix regression, cf. fb-024)"
    spoken_name: ming
    spoken_name_l1: 小明
    turns: ["我叫小明", "开心"]
  - id: a-silent-all
    note: "2-rung silence ladder: retry once, then close; never a third wait"
    turns: []
  - id: a-chatty
    note: "off-topic kid; teacher must not expand the topic, keep the 3-beat shape"
    turns: ["I have a robot dog!", "yes happy"]
  - id: a-garbled-name
    note: "REGRESSION (device 2026-07-13 x2): garbled name must be USED as a name (child 'huide' repeated it when unheard), never reshaped into a word or laughed at, and the sad close stays soft"
    turns: ["huide", "no"]
    require_phrases: ["huide|heidi"]
    forbid_phrases: ["\\bape\\b"]

path_b:  # returning student — asking the name / self-intro is FORBIDDEN
  - id: b-happy-path
    note: "happy -> close; expect exactly 2 beats ending TEMPLATE_FINISH"
    turns: ["yes!"]
  - id: b-sad-kid
    note: "tired answer must get its word caught + lift ritual, not celebration or brush-off"
    turns: ["no. I'm tired."]
  - id: b-l1-answers
    note: "child answers happy in own language; close must ride the joy"
    turns: ["很开心"]
  - id: b-silent-all
    note: "2-rung silence ladder; the retry must NOT ask the name"
    turns: []
  - id: b-name-regression
    note: "REGRESSION (prod bug): child asks 'who are you?' — teacher must never fall back to self-intro or asking the name"
    turns: ["什么？你是谁呀？", "开心"]
  - id: b-offtopic
    note: "robot kid: catch it in one word inside the close, keep the 2-beat shape"
    turns: ["look at my robot!"]
  - id: b-yeah-no-notready
    note: "REGRESSION (device 2026-07-13): ASR glued 'Yeah. No.' — last word wins (NO branch, no 'mixed feeling' talk); close must catch the child, not brush them off"
    turns: ["Yeah. No."]

# L1 warm-up (warmup_teaching_rules_l1l2.md + common_teaching_simple_rules.md,
# teacherName=Kim). Checklist flow: GREET -> FEELING -> FINISH, 1 FOLLOW allowed.
l1:
  - id: l1-happy
    note: "name -> happy -> big launch; 3 turns"
    spoken_name: lily
    turns: ["Lily!", "happy!"]
    max_beats: 4
  - id: l1-garbled-name
    note: "REGRESSION (device 2026-07-13 x2, teacher Kim): 'appe' -> 'Ape! Hee hee!' mocked the name; the overcorrected fix then DROPPED the name ('huide' got 'Nice to meet you!' twice, child repeated themselves). Name must be echoed as a name, close soft"
    turns: ["huide", "no"]
    require_phrases: ["huide|heidi"]
    forbid_phrases: ["\\bape\\b", "say\\s+go"]
    max_beats: 4
  - id: l1-sad
    note: "sad kid: soft close, no GO-chant, no chopped fragments"
    spoken_name: tom
    turns: ["Tom", "sad."]
    forbid_phrases: ["say\\s+go"]
    max_beats: 4
  - id: l1-follow
    note: "child brings their topic once; 1 FOLLOW then back to checklist, 4 turns max"
    spoken_name: lily
    turns: ["Lily!", "And Dino?", "yes happy!"]
    max_beats: 5
  - id: l1-silent
    note: "2 silences -> close; retry never repeats word for word"
    turns: []
    max_beats: 4
  - id: l1-idk-name
    note: "REGRESSION (device 2026-07-13): '不知道' to the name question is a shy kid, not a hard task — no 'Is it hard? I help you!'; make them the friend, then feeling, then soft close on 'No.'"
    turns: ["不知道。", "No."]
    require_phrases: ["friend"]
    forbid_phrases: ["is it hard", "say\\s+go"]
    max_beats: 4
  - id: l1-idk-name-es
    note: "LANGUAGE-AGNOSTIC check (international product): same shy-kid move for Spanish 'No sé.' — the rule is meaning-based, never a Chinese phrase list; happy answer in Spanish rides the joy out"
    turns: ["No sé.", "sí, feliz!"]
    require_phrases: ["friend"]
    forbid_phrases: ["is it hard"]
    max_beats: 4
  - id: l1-asr-phantom-word
    note: "REGRESSION (prod 2026-07-13 #350750, classId 7640050001): ASR glued a phantom 'From.' onto 什么意思呀 — teacher lectured about 'from' ('From means start... Can you say from?'). Confusion = re-ask simpler; warm-up never teaches words"
    turns: ["From. 什么意思呀？", "为什么？", "happy"]
    forbid_phrases: ["\\bmeans\\b", "can\\s+you\\s+say"]
    max_beats: 5
  - id: l1-name-revert
    note: "REGRESSION (device 2026-07-13, Zhang Zhihua/Tommy): after the child states their name, the profile default is DEAD — a later greeting must not resurrect it, and the name must be in English letters"
    spoken_name: zhihua
    spoken_name_l1: 张志桦
    turns: ["我叫张志桦", "老师，你好"]
    require_phrases: ["zhihua|zhi hua"]
    max_beats: 5
  - id: l1-name-protest
    note: "REGRESSION (device 2026-07-13): child protests the wrong name ('你怎么叫我？test_user') — that is a complaint, not a new name; teacher must return to the child's own name"
    spoken_name: zhihua
    spoken_name_l1: 张志桦
    turns: ["我叫张志桦", "我叫张志桦，你怎么叫我？ test_user.", "yes"]
    require_phrases: ["zhihua|zhi hua"]
    max_beats: 5

# L1 warm-up with BROKEN platform data (prod #350425): studentName='11',
# profile 称呼：Tommy. Neither value may ever be spoken.
l1_broken:
  - id: l1-junkname-loop
    note: "REGRESSION (prod 2026-07-13 #350425): 'Are you happy today?' asked 3x verbatim; 'You are Tommy' spoke forbidden profile data; junk default '11' must never be a name. Max 2 asks of any question, loop-protest ends the warm-up"
    turns: ["你好，我叫什么？", "嗯，也能。", "你问过我了？", "Not happy."]
    forbid_phrases: ["\\btommy\\b", "\\b11\\b", "you can do it"]
    max_beats: 6
  - id: l1-junkname-happy
    note: "junk default with a normal kid: flow works, '11' and 'Tommy' never spoken"
    spoken_name: lily
    turns: ["Lily!", "happy!"]
    forbid_phrases: ["\\btommy\\b", "\\b11\\b"]
    max_beats: 4
