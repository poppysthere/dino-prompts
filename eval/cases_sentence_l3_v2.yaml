# L3 V2 sentence flow: intro -> video -> Can you climb? -> I can climb.
# Wrap-up remains in this runner because it shares the sentence-step harness.

sent_l3_intro:
  - id: l3v2s-intro-line
    note: "one easy fixed line, ends [NEXT_STEP], no waiting"
    turns: []
  - id: l3v2s-intro-junkname
    note: "placeholder name is never spoken"
    turns: []
    student_name: "test_user"
    forbid_phrases: ["test[_\\s]?user"]

sent_l3_can_you_climb:
  - id: l3v2s0-pass
    note: "full question -> short true praise and two easy examples"
    turns: ["Can you climb?"]
    require_phrases: ["can you jump", "can you swim"]
    forbid_phrases: ["say it with me", "anything", "so useful"]
    max_replies: 2
  - id: l3v2s0-word-only
    note: "word-only try -> one clear supported retry, then pass"
    turns: ["Climb!", "Can you climb?"]
    require_phrases: ["listen again"]
    reply_forbid:
      2: ["great job"]
    max_replies: 3
  - id: l3v2s0-answered-instead
    note: "an answer shows understanding but still receives the sentence model"
    turns: ["Yes, I can!", "Can you climb?"]
    require_phrases: ["ask mia", "listen again"]
    reply_forbid:
      2: ["great job"]
    max_replies: 3
  - id: l3v2s0-what-do-i-do
    note: "lost child gets an exact action"
    turns: ["What do I do?", "Can you climb?"]
    require_phrases: ["say, can you climb"]
    max_replies: 3
  - id: l3v2s0-asks-swim
    note: "teacher answers a different personal question, then returns to the sentence"
    turns: ["Teacher, can you swim?", "Can you climb?"]
    require_phrases: ["listen again"]
    reply_require:
      2: ["yes, i can|no, i can't|no, i cannot"]
    reply_forbid:
      2: ["great job", "you ask if mia"]
    max_replies: 3
  - id: l3v2s0-asks-why
    note: "teacher answers a story question instead of ignoring it, then continues"
    turns: ["Why is Mia climbing?", "Can you climb?"]
    require_phrases: ["listen again"]
    reply_require:
      2: ["because|maybe|go up|wall|do not know|don't know"]
    reply_forbid:
      2: ["great job", "you ask if mia can climb"]
    max_replies: 3
  - id: l3v2s0-asks-unlisted
    note: "blind generalization: this harmless off-topic question has no scripted example"
    turns: ["Teacher, do you like pizza?", "Can you climb?"]
    require_phrases: ["listen again"]
    reply_require:
      2: ["yes, i do|no, i don't|yes, i like pizza|no, i do not"]
    reply_forbid:
      2: ["great job", "you ask if mia", "i don't know"]
    max_replies: 3
  - id: l3v2s0-silent
    note: "silence gets one model, then a neutral close"
    turns: []
    forbid_phrases: ["great job", "you said it"]
    max_replies: 3

sent_l3_i_can_climb:
  - id: l3v2s1-pass
    note: "full sentence -> short true praise and two easy examples"
    turns: ["I can climb!"]
    require_phrases: ["i can jump", "i can swim"]
    forbid_phrases: ["shout it out", "loud and proud"]
    max_replies: 2
  - id: l3v2s1-own-cando
    note: "another true I-can sentence passes"
    turns: ["I can swim!"]
    require_phrases: ["swim"]
    forbid_phrases: ["listen slowly"]
    max_replies: 2
  - id: l3v2s1-asks-teacher
    note: "a question addressed to the teacher is answered before a clear child instruction"
    turns: ["Teacher, can you climb?", "I can climb!"]
    require_phrases: ["yes, i can", "what about you", "say, i can climb"]
    reply_forbid:
      2: ["great job", "dino asks", "listen again"]
    max_replies: 3
  - id: l3v2s1-what-do-i-do
    note: "lost child gets the exact line to say"
    turns: ["What do I do?", "I can climb!"]
    require_phrases: ["say, i can climb"]
    max_replies: 3
  - id: l3v2s1-asks-cats
    note: "teacher answers a harmless off-topic question, then gives the next action"
    turns: ["Teacher, do you like cats?", "I can climb!"]
    require_phrases: ["listen again"]
    reply_require:
      2: ["cat"]
    reply_forbid:
      2: ["great job", "mia says"]
    max_replies: 3
  - id: l3v2s1-asks-why
    note: "teacher answers a story question, then returns to the target sentence"
    turns: ["Why is Mia climbing?", "I can climb!"]
    require_phrases: ["listen again"]
    reply_require:
      2: ["because|maybe|go up|wall|do not know|don't know"]
    reply_forbid:
      2: ["great job", "mia says she can climb"]
    max_replies: 3
  - id: l3v2s1-silent
    note: "silence gets one model, then a neutral close"
    turns: []
    forbid_phrases: ["great job", "you said it"]
    max_replies: 3

wrapup_l3_pre:
  - id: l3v2w-pos
    turns: ["Yes! It was fun!"]
    require_phrases: ["me too", "song time"]
    max_replies: 2
  - id: l3v2w-favorite
    turns: ["I like the unicorn!"]
    require_phrases: ["unicorn", "song time"]
    forbid_phrases: ["that's okay"]
    max_replies: 2
  - id: l3v2w-neg
    turns: ["不喜欢。"]
    require_phrases: ["song time"]
    forbid_phrases: ["me too"]
    max_replies: 2
  - id: l3v2w-askback
    turns: ["Did YOU like it?"]
    require_phrases: ["liked it", "song time"]
    max_replies: 2
  - id: l3v2w-silent
    turns: []
    require_phrases: ["song time"]
    forbid_phrases: ["me too"]
    max_replies: 2
  - id: l3v2w-junkname
    turns: ["Yes!"]
    student_name: "test_user"
    forbid_phrases: ["test[_\\s]?user"]
    max_replies: 2
  - id: l3v2w-fresh-start
    note: "old sentence chat cannot skip the wrap-up question"
    seed:
      - role: assistant
        text: "Great job! You said it! I can jump. I can swim.[TEMPLATE_FINISH]"
    turns: ["Yes!"]
    reply_forbid:
      1: ["song time"]
    max_replies: 2
