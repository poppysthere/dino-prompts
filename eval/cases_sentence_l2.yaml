sent_intro:
  - id: l2sent-intro
    note: "One short A1 video launch"
    turns: []
    max_replies: 1

sent_cow:
  - id: l2sent-cow-pass
    note: "Full sentence advances immediately"
    turns: ["It's a cow."]
    max_replies: 2

  - id: l2sent-cow-word
    note: "Word-only try gets one supported whole-sentence retry"
    turns: ["cow", "It's a cow."]
    max_replies: 3
    reply_require:
      "2": ["Now try the sentence", "Let's try again"]

  - id: l2sent-cow-name
    note: "Name question answered before the retry"
    turns: ["What's your name?", "It's a cow."]
    teacher_name: "Kim"
    max_replies: 3
    reply_require:
      "2": ["^I'm Kim\\.", "Let's try again"]

  - id: l2sent-cow-dog-after-retry
    note: "Question after retry answered before the step ends"
    turns: ["okay", "Do you like my dog?"]
    max_replies: 3
    reply_require:
      "3": ["^Yes, I like dogs!", "Let's open the next bag"]

  - id: l2sent-cow-silent
    note: "One retry, then warm forward move without fake praise"
    turns: []
    max_replies: 3
    forbid_phrases: ["great job", "you got it"]

  - id: l2sent-cow-blind-pizza
    note: "BLIND CASE: unlisted question answered before teaching continues"
    turns: ["Do you like pizza?", "It's a cow."]
    max_replies: 3
    reply_require:
      "2": ["^Yes, I (?:like|love) pizza", "Let's try again"]

sent_cat:
  - id: l2sent-cat-pass
    note: "Full sentence advances immediately"
    turns: ["It's a cat."]
    max_replies: 2

  - id: l2sent-cat-old-sentence
    note: "Old sentence acknowledged, never celebrated as cat"
    turns: ["It's a cow.", "It's a cat."]
    max_replies: 3
    reply_require:
      "2": ["cow was first", "Let's try again"]
    reply_forbid:
      "2": ["Yes! It's a cat"]

  - id: l2sent-cat-weather
    note: "Weather question answered honestly before the retry"
    turns: ["How's the weather?", "It's a cat."]
    max_replies: 3
    reply_require:
      "2": ["^I can't see the sky\\.", "Let's try again"]

  - id: l2sent-cat-name-after-retry
    note: "Name question after retry gets answered before moving on"
    turns: ["okay", "What's your name?"]
    teacher_name: "Kim"
    max_replies: 3
    reply_require:
      "3": ["^I'm Kim\\.", "Let's open the next bag"]

  - id: l2sent-cat-silent
    note: "Silence moves forward after one retry"
    turns: []
    max_replies: 3
    forbid_phrases: ["great job", "you got it"]

sent_horse:
  - id: l2sent-horse-pass
    note: "Sentence -> supported choice question -> neutral video close"
    turns: ["It's a horse.", "horse"]
    max_replies: 3
    forbid_phrases: ["the horse ate", "you got it"]

  - id: l2sent-horse-asr
    note: "It's of course counts as the full target"
    turns: ["It's of course.", "cat"]
    max_replies: 3
    reply_forbid:
      "2": ["Let's try again"]

  - id: l2sent-horse-name
    note: "Name question answered before one retry"
    turns: ["What's your name?", "It's a horse.", "cat"]
    teacher_name: "Kim"
    max_replies: 4
    reply_require:
      "2": ["^I'm Kim\\.", "Let's try again"]

  - id: l2sent-horse-dog-after-retry
    note: "Dog question after retry answered before the mystery question"
    turns: ["okay", "Do you like my dog?", "cat"]
    max_replies: 4
    reply_require:
      "3": ["^Yes, I like dogs!", "Who has the cake"]

  - id: l2sent-horse-weather-close
    note: "Weather question at final beat answered before video launch"
    turns: ["It's a horse.", "How's the weather?"]
    max_replies: 3
    reply_require:
      "3": ["^I can't see the sky\\.", "Let's watch and find out"]

  - id: l2sent-horse-silent
    note: "Full silence uses one retry, asks once, then advances"
    turns: []
    max_replies: 4
    forbid_phrases: ["great job", "you got it"]

  - id: l2sent-horse-blind-color
    note: "BLIND CASE: new harmless question answered before retry"
    turns: ["What's your favorite color?", "It's a horse.", "cow"]
    max_replies: 4
    reply_require:
      "2": ["^(?:My favorite color is|I like) (?:blue|red|green|yellow|pink|purple)", "Let's try again"]

sent_reveal:
  - id: l2reveal-hit
    note: "Horse guess receives the warm hit line"
    seed:
      - role: assistant
        text: "Yes! It's a horse. Who has the cake? Cow, cat, or horse?[TEACHER_LISTEN][STUDENT_TALK]"
      - role: user
        text: "horse"
    turns: []
    require_phrases: ["you were right"]

  - id: l2reveal-hit-own-language
    note: "Horse meaning in another language still counts"
    seed:
      - role: assistant
        text: "Yes! It's a horse. Who has the cake? Cow, cat, or horse?[TEACHER_LISTEN][STUDENT_TALK]"
      - role: user
        text: "马"
    turns: []
    require_phrases: ["you were right"]

  - id: l2reveal-miss
    note: "Other guess is never mocked"
    seed:
      - role: assistant
        text: "Yes! It's a horse. Who has the cake? Cow, cat, or horse?[TEACHER_LISTEN][STUDENT_TALK]"
      - role: user
        text: "cat"
    turns: []
    forbid_phrases: ["wrong", "you were right"]

  - id: l2reveal-junkname
    note: "Junk child name is never spoken"
    seed:
      - role: assistant
        text: "Yes! It's a horse. Who has the cake? Cow, cat, or horse?[TEACHER_LISTEN][STUDENT_TALK]"
      - role: user
        text: "horse"
    turns: []
    student_name: "test_user"
    forbid_phrases: ["test[_\\s]?user"]
