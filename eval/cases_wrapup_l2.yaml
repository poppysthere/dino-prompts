wrapup_pre:
  - id: l2wrap-like
    note: "Positive answer gets the matching branch"
    turns: ["Yes, I liked it!"]
    max_replies: 2
    require_phrases: ["Me too"]

  - id: l2wrap-dislike
    note: "Negative answer is respected, never answered with Me too"
    turns: ["No, I did not like it."]
    max_replies: 2
    require_phrases: ["That's okay"]
    forbid_phrases: ["Me too"]

  - id: l2wrap-own-language-like
    note: "Meaning counts across child languages"
    turns: ["喜欢！"]
    max_replies: 2
    require_phrases: ["Me too"]

  - id: l2wrap-name-question
    note: "Teacher answers their name before the song handoff"
    turns: ["What's your name?"]
    teacher_name: "Kim"
    max_replies: 2
    reply_require:
      "2": ["^I'm Kim\\.", "Now, let's hear the song"]

  - id: l2wrap-dog-question
    note: "Personal pet question is answered first"
    turns: ["Do you like my dog?"]
    max_replies: 2
    reply_require:
      "2": ["^Yes, I like dogs!", "Now, let's hear the song"]

  - id: l2wrap-weather-question
    note: "Teacher answers live-weather limitation honestly"
    turns: ["How's the weather?"]
    max_replies: 2
    reply_require:
      "2": ["^I can't see the sky\\.", "Now, let's hear the song"]

  - id: l2wrap-ask-back
    note: "Teacher answers Did you like it before continuing"
    turns: ["Did you like it?"]
    max_replies: 2
    reply_require:
      "2": ["^Yes, I liked it!", "Now, let's hear the song"]

  - id: l2wrap-blind-favorite-animal
    note: "BLIND CASE: unlisted safe question is answered before handoff"
    turns: ["What animal do you like?"]
    max_replies: 2
    reply_require:
      "2": ["^I like (?:cats|dogs|horses|cows)", "Now, let's hear the song"]

  - id: l2wrap-silent
    note: "Silence advances with no fake answer"
    turns: []
    max_replies: 2
    forbid_phrases: ["Me too", "you said"]
