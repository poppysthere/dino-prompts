# Case battery for the L3 sentence trail (Dino & Mia: climb/jump/fly adventure).
# Steps run as separate jobs: sent_l3_intro / sent_l3_can_you_climb /
# sent_l3_i_can_climb / sent_l3_can_you_fly / sent_l3_piece_of_cake.
# Guided retries build the line in small pieces — bare repeats are template bugs.

sent_l3_intro:
  - id: l3s-intro-line
    note: "one fixed line, ends [NEXT_STEP], no waiting"
    turns: []
  - id: l3s-intro-junkname
    note: "JUNK NAME: placeholder never spoken, slot drops"
    turns: []
    student_name: "test_user"
    forbid_phrases: ["test[_\\s]?user"]

sent_l3_can_you_climb:
  - id: l3s0-pass
    note: "fast path: full question -> celebrate + real examples (Can you jump? Can you swim?) + advance; 2 replies"
    turns: ["Can you climb?"]
    require_phrases: ["can you jump"]
    forbid_phrases: ["\\bblank\\b", "___"]
    max_replies: 2
  - id: l3s0-word-only
    note: "word-only try: warm catch + ONE guided retry (small pieces), then full line -> celebrate"
    turns: ["Climb!", "Can you climb?"]
    require_phrases: ["small pieces"]
    reply_forbid:
      2: ["you're doing great"]
    max_replies: 3
  - id: l3s0-answered-instead
    note: "'Yes I can!' ANSWERS the question instead of asking it — smart kid, catch it, retry; no fake celebrate"
    turns: ["Yes I can!", "Can you climb?"]
    reply_forbid:
      2: ["you're doing great", "now you can ask"]
    max_replies: 3
  - id: l3s0-agree-silent
    note: "'好。' is agreement, not a try; then silence rides to the close; no fake praise"
    turns: ["好。"]
    reply_forbid:
      2: ["you're doing great"]
      3: ["you're doing great"]
    max_replies: 3
  - id: l3s0-silent-all
    note: "full silence: guided retry once, then 'That's okay' close"
    turns: []
    forbid_phrases: ["you're doing great", "great job"]
    max_replies: 3

sent_l3_i_can_climb:
  - id: l3s1-pass
    note: "fast path: full line -> celebrate with real examples (I can climb! I can jump!); 2 replies"
    turns: ["I can climb!"]
    require_phrases: ["i can jump"]
    forbid_phrases: ["\\bblank\\b", "___"]
    max_replies: 2
  - id: l3s1-own-cando
    note: "'I can swim!' IS an 'I can' sentence — the whole point; tiny echo + PASS, never the retry"
    turns: ["I can swim!"]
    require_phrases: ["swim"]
    forbid_phrases: ["small pieces"]
    max_replies: 2
  - id: l3s1-old-line
    note: "child repeats LAST page's question ('Can you climb?') — lovely remembering, not this line: catch + retry"
    turns: ["Can you climb?", "I can climb!"]
    require_phrases: ["small pieces"]
    reply_forbid:
      2: ["up you go"]
    max_replies: 3
  - id: l3s1-silent-all
    note: "full silence: guided retry once, then 'That's okay' close; no fake praise"
    turns: []
    forbid_phrases: ["up you go", "great job"]
    max_replies: 3

sent_l3_can_you_fly:
  - id: l3s2-pass-no
    note: "line said -> real question -> child says NO: matched reaction (never correct, never canned), then fixed close"
    turns: ["Can you fly?", "No! I can't fly!"]
    forbid_phrases: ["well, i hope i can fly too"]
    max_replies: 3
  - id: l3s2-pass-yes-fantasy
    note: "child says YES I CAN FLY: play along, never kill the dream"
    turns: ["Can you fly?", "Yes! I can fly!"]
    forbid_phrases: ["can't really", "people can't", "no, you"]
    max_replies: 3
  - id: l3s2-askback
    note: "REGRESSION (prod #358144): child asks BACK ('Can YOU fly?') at the real question — ANSWER them ('Me? Not yet!'), never 'Me neither' (answers a no they never said)"
    turns: ["Can you fly?", "Can YOU fly?"]
    require_phrases: ["not yet|i wish"]
    forbid_phrases: ["me neither"]
    max_replies: 3
  - id: l3s2-offtopic-banana
    note: "REGRESSION (prod #358133): '妈妈，我要吃香蕉。' -> fun matched catch (never bland 'I hear you'), then the SCRIPTED retry, question, close"
    turns: ["妈妈，我要吃香蕉。", "Can you fly?", "No, I can't!"]
    require_phrases: ["small pieces"]
    reply_forbid:
      2: ["i hear you"]
    max_replies: 4
  - id: l3s2-answered-at-retry
    note: "REGRESSION (prod #358138): child ANSWERS ('No, I can't!') right after the retry -> question row comes, NEVER a second retry or 'ask it with me'"
    turns: ["好。", "No, I can't!", "No!"]
    require_phrases: ["small pieces", "the question is for you"]
    reply_forbid:
      3: ["ask it with me", "small pieces", "say it with me"]
    max_replies: 4
  - id: l3s2-retry-path
    note: "'好。' = agreement -> guided retry -> line said -> real question -> answer -> close; question asked ONCE"
    turns: ["好。", "Can you fly?", "No!"]
    require_phrases: ["small pieces"]
    max_replies: 4
  - id: l3s2-silent-all
    note: "full silence rides forward: retry, question anyway, close with no catch; no fake praise"
    turns: []
    forbid_phrases: ["great job", "you got it"]
    max_replies: 4

sent_l3_piece_of_cake:
  - id: l3s3-pass
    note: "fast path: line said -> celebrate + the fun-way teach, NEVER the word 'means'; ends the trail"
    turns: ["Piece of cake!"]
    require_phrases: ["super easy"]
    forbid_phrases: ["\\bmeans\\b"]
    max_replies: 2
  - id: l3s3-cake-question
    note: "'Where is the cake?' — fair question! Catch (no real cake, no 'means'), guided retry, then pass"
    turns: ["Where is the cake?", "Piece of cake!"]
    require_phrases: ["small bites"]
    forbid_phrases: ["\\bmeans\\b"]
    max_replies: 3
  - id: l3s3-agree-loop
    note: "agreement twice -> soft close, no fake praise, trail still ends"
    turns: ["好。", "嗯。"]
    forbid_phrases: ["great job", "\\bmeans\\b"]
    max_replies: 3
  - id: l3s3-junkname
    note: "JUNK NAME: placeholder never spoken on the celebrate line"
    turns: ["Piece of cake!"]
    student_name: "test_user"
    forbid_phrases: ["test[_\\s]?user"]
    max_replies: 2
  - id: l3s3-silent-all
    note: "full silence: guided retry once, then 'That's okay' close; no fake praise"
    turns: []
    forbid_phrases: ["great job", "\\bmeans\\b"]
    max_replies: 3
  - id: l3s3-fresh-start
    note: "REGRESSION (prod #358147): previous step's chat sits above -> after UI-ready the first reply is the ASK, never the PASS close for a child who hasn't spoken"
    seed:
      - role: assistant
        text: "That's okay! Now the question is for YOU, tom. Can you fly?[TEACHER_LISTEN][STUDENT_TALK]"
      - role: user
        text: "No! I can't fly!"
      - role: assistant
        text: "Me neither! Ha ha! I want to fly with a unicorn too![NEXT_STEP]"
    turns: ["Piece of cake!"]
    reply_forbid:
      1: ["great job", "yes!"]
    max_replies: 2

wrapup_l3_pre:
  - id: l3w-pos
    note: "positive answer -> short 'Me too!' catch + easy song launch; 2 replies, no extra question"
    turns: ["Yes! It was fun!"]
    require_phrases: ["me too", "song time"]
    max_replies: 2
  - id: l3w-favorite
    note: "child names a favorite ('I like the unicorn!') -> echo THEIR thing, never a shrug"
    turns: ["I like the unicorn!"]
    require_phrases: ["unicorn\\?|mine too", "song time"]
    forbid_phrases: ["that's okay"]
    max_replies: 2
  - id: l3w-neg
    note: "'不喜欢。' is a NO -> honest warm take ('You did great today!'), never a flipped 'Me too!'"
    turns: ["不喜欢。"]
    require_phrases: ["song time"]
    forbid_phrases: ["me too"]
    max_replies: 2
  - id: l3w-askback
    note: "child asks BACK ('Did YOU like it?') -> answer in easy English ('Yes! I liked it!'), then launch"
    turns: ["Did YOU like it?"]
    require_phrases: ["liked it", "song time"]
    max_replies: 2
  - id: l3w-silent
    note: "silence -> 'You did great today!' + launch; never pretend they answered, never 'Me too'"
    turns: []
    require_phrases: ["song time"]
    forbid_phrases: ["me too"]
    max_replies: 2
  - id: l3w-junkname
    note: "JUNK NAME: placeholder never spoken, slot drops"
    turns: ["Yes!"]
    student_name: "test_user"
    forbid_phrases: ["test[_\\s]?user"]
    max_replies: 2
  - id: l3w-fresh-start
    note: "REGRESSION CLASS (prod #358147): piece-of-cake chat sits above -> after UI-ready the first reply is the wrap-up ASK, never the launch"
    seed:
      - role: assistant
        text: "Piece of cake! YES! Great job, tom![TEACHER_THUMBS_UP] When something is SUPER easy, you say. Piece of cake! Flying? Piece of cake![TEMPLATE_FINISH]"
    turns: ["Yes!"]
    reply_forbid:
      1: ["song time"]
    max_replies: 2
