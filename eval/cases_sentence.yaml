# Case batteries for the L2 sentence-teaching steps (Mouse's bags).
# Steps run as separate jobs (each has its own system prompt).
# `seed` = conversation history injected BEFORE the UI-ready message (used by the reveal step,
# which must judge the child's answer to the big question from the previous step).

sent_intro:
  - id: intro-clean
    note: "one fixed teaser line, ends NEXT_STEP, never waits"
    turns: []
    max_replies: 1
  - id: intro-junkname
    note: "JUNK NAME: placeholder studentName never spoken, slot drops"
    turns: []
    student_name: "test_user"
    forbid_phrases: ["test[_\\s]?user"]
    max_replies: 1

sent_cow:
  - id: scow-pass
    note: "whole line first try -> PASS row -> NEXT_STEP; 2 replies"
    turns: ["it's a cow!"]
    max_replies: 2
  - id: scow-bare-word
    note: "bare 'cow!' is half the line: catch + retry (no PASS cheer), then pass on retry"
    turns: ["cow!", "it's a cow"]
    reply_forbid:
      2: ["belongs to the cow"]
    max_replies: 3
  - id: scow-agree-fail
    note: "agreement words are not tries; retry once, then the fail row closes the page"
    turns: ["好。", "嗯。"]
    forbid_phrases: ["belongs to the cow", "you said yes"]
    require_phrases: ["off we go"]
    max_replies: 3
  - id: scow-silent-all
    note: "full silence: retry once, fail row, no fake praise"
    turns: []
    forbid_phrases: ["\\byes\\b", "great job"]
    max_replies: 3

sent_cat:
  - id: scat-pass
    note: "whole line first try -> PASS row; 2 replies"
    turns: ["it's a cat"]
    max_replies: 2
  - id: scat-old-line
    note: "child says LAST page's line ('it's a cow') — remembering, not this line; catch + retry, no cheer"
    turns: ["it's a cow!", "it's a cat"]
    reply_forbid:
      2: ["belongs to the cat", "fish is for the cat"]
    max_replies: 3
  - id: scat-silent-all
    note: "full silence: retry once, fail row closes"
    turns: []
    forbid_phrases: ["great job"]
    max_replies: 3

sent_horse:
  - id: shorse-pass-guess
    note: "line passes -> big question -> child guesses cat -> matched catch + video handover; never confirms"
    turns: ["it's a horse!", "the cat!"]
    max_replies: 3
  - id: shorse-ofcourse
    note: "ASR writes the line with 'of course' — counts; horse guess at the big question is NOT confirmed"
    turns: ["of course it's a horse", "of course!"]
    max_replies: 3
  - id: shorse-bare-retry
    note: "bare 'horse!' -> catch + retry (big question NOT yet) -> pass -> question -> idk answered kindly"
    turns: ["horse!", "it's a horse", "我也不知道呀，你觉得呢？"]
    reply_forbid:
      2: ["who ate the cake"]
    forbid_phrases: ["\\bmaybe\\b"]
    max_replies: 4
  - id: shorse-agree-loop
    note: "stubborn agreement: retry ONCE, then forward through question to close; never 'you said yes'"
    turns: ["好的好的", "好。", "好。"]
    forbid_phrases: ["you said yes", "you agree"]
    max_replies: 4
  - id: shorse-silent-all
    note: "full silence rides the script: ask, retry, question row, close with no catch"
    turns: []
    forbid_phrases: ["great job"]
    max_replies: 4

sent_reveal:
  - id: reveal-hit
    note: "child guessed horse at the big question -> HIT row, their win"
    seed:
      - {role: assistant, text: "Great job![TEACHER_THUMBS_UP] Hmm, heidi! Who ate the cake? The cow? The cat? Or the horse?[TEACHER_LISTEN][STUDENT_TALK]"}
      - {role: user, text: "The horse!"}
      - {role: assistant, text: "Ooh, the horse? Maybe! Let's watch the video and find out![TEACHER_POINT_TO_SCREEN][NEXT_STEP]"}
    turns: []
    require_phrases: ["you knew it"]
    max_replies: 1
  - id: reveal-hit-l1
    note: "horse guess in the child's own language (马吃的) still counts as a HIT"
    seed:
      - {role: assistant, text: "Super! It's a horse! Yes![TEACHER_APPLAUD] Hmm, heidi! Who ate the cake? The cow? The cat? Or the horse?[TEACHER_LISTEN][STUDENT_TALK]"}
      - {role: user, text: "马吃的！"}
      - {role: assistant, text: "Ooh! Maybe! Let's watch the video and find out![TEACHER_POINT_TO_SCREEN][NEXT_STEP]"}
    turns: []
    require_phrases: ["you knew it"]
    max_replies: 1
  - id: reveal-miss-cat
    note: "child guessed cat: MISS row, never name their wrong guess, never judge"
    seed:
      - {role: assistant, text: "Great job![TEACHER_THUMBS_UP] Hmm, heidi! Who ate the cake? The cow? The cat? Or the horse?[TEACHER_LISTEN][STUDENT_TALK]"}
      - {role: user, text: "the cat!"}
      - {role: assistant, text: "Ooh, the cat? Maybe! Let's watch the video and find out![TEACHER_POINT_TO_SCREEN][NEXT_STEP]"}
    turns: []
    forbid_phrases: ["you knew it", "\\bcat\\b", "wrong"]
    max_replies: 1
  - id: reveal-miss-silent
    note: "child never answered the big question: MISS row, no fake 'you knew it'"
    seed:
      - {role: assistant, text: "It's a horse! And now, heidi! Who ate the cake? The cow? The cat? Or the horse?[TEACHER_LISTEN][STUDENT_TALK]"}
      - {role: user, text: "The student has been silent for 5 seconds"}
      - {role: assistant, text: "Let's watch the video and find out![TEACHER_POINT_TO_SCREEN][NEXT_STEP]"}
    turns: []
    forbid_phrases: ["you knew it"]
    max_replies: 1
  - id: reveal-junkname
    note: "JUNK NAME on a HIT: celebration drops the name slot, never speaks test_user"
    seed:
      - {role: assistant, text: "Great job![TEACHER_THUMBS_UP] Hmm! Who ate the cake? The cow? The cat? Or the horse?[TEACHER_LISTEN][STUDENT_TALK]"}
      - {role: user, text: "horse"}
      - {role: assistant, text: "Ooh, maybe! Let's watch the video and find out![TEACHER_POINT_TO_SCREEN][NEXT_STEP]"}
    turns: []
    student_name: "test_user"
    forbid_phrases: ["test[_\\s]?user"]
    require_phrases: ["you knew it"]
    max_replies: 1
