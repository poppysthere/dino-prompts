# Human classroom feedback log — the third eye of the eval loop.
#
# Every observation from real on-device testing lands here. Each item either:
#   - becomes a checker rule / regression case (status: encoded),
#   - is fixed in templates or process (status: fixed),
#   - or stays open (status: open) — open items are fed to the LLM judge as extra
#     watch items, so machine review keeps looking for what humans noticed.
#
# Humans stay on the approve button: no template change ships without a human
# reading the diff, and device findings (TTS sound, animations, ASR) can only
# come from here — no transcript eval can hear them.

