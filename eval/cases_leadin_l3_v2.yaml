# L3 V2 starts class in lead-in: welcome + clear directions, then the story.

pre_video:
  - id: l3v2pre-hi
    note: "the product's say-hi task gets one natural hello exchange, then class starts"
    turns: ["Hi!"]
    require_phrases: ["nice to meet you", "three new words", "dino and mia"]
    forbid_phrases: ["ready\\?"]
  - id: l3v2pre-own-language-hi
    note: "another-language greeting is understood as hello; teacher stays in English"
    turns: ["你好！"]
    require_phrases: ["nice to meet you", "three new words"]
    forbid_phrases: ["ready\\?"]
  - id: l3v2pre-not-ready
    note: "not-ready child gets one warm rescue before the lesson starts"
    turns: ["No, I'm not ready.", "Hi!"]
    require_phrases: ["okay", "listen first", "three new words"]
    forbid_phrases: ["great, let's go"]
  - id: l3v2pre-what-do-i-do
    note: "child gets an exact hi instruction and one modeled rescue"
    turns: ["What do I do?", "Hi!"]
    require_phrases: ["say hi to me", "listen first", "three new words"]
  - id: l3v2pre-question
    note: "teacher answers a safe child question, then returns to the say-hi task"
    turns: ["Do you like cats?", "Hi!"]
    require_phrases: ["cat", "listen first", "three new words"]
  - id: l3v2pre-silent
    note: "silence gets one modeled hi rescue, then the lesson starts without fake praise"
    turns: []
    require_phrases: ["listen first", "three new words", "dino and mia"]
    forbid_phrases: ["great job", "nice to meet you too"]
  - id: l3v2pre-junkname
    note: "placeholder child name is never spoken"
    turns: ["Hi!"]
    student_name: "test_user"
    forbid_phrases: ["test[_\\s]?user"]
  - id: l3v2pre-teacher-kim
    note: "teacher self-introduction comes from teacherName, never a hardcoded example"
    turns: ["Hi, Kim!"]
    teacher_name: "Kim"
    require_phrases: ["i'm kim", "three new words"]
    forbid_phrases: ["i'm max", "i'm leo"]

post_video:
  - id: l3v2post-yes
    note: "the easy yes-or-no question accepts a one-word yes"
    turns: ["Yes!"]
    require_phrases: ["maybe"]
    forbid_phrases: ["good idea", "what fun"]
  - id: l3v2post-no
    note: "a one-word no is a complete answer and is not corrected"
    turns: ["No."]
    require_phrases: ["maybe not"]
    forbid_phrases: ["good idea", "what fun"]
  - id: l3v2post-idea
    turns: ["They will fly! Fly high!"]
    require_phrases: ["\\bfly\\b"]
    forbid_phrases: ["what fun"]
  - id: l3v2post-idk
    turns: ["I don't know."]
    forbid_phrases: ["good idea", "what fun"]
  - id: l3v2post-silent
    turns: []
    forbid_phrases: ["good idea", "what fun"]
