# L3 V2 starts class in lead-in: welcome + clear directions, then the story.

pre_video:
  - id: l3v2pre-ready
    note: "ready child gets a natural catch, then the video starts"
    turns: ["Yes, I'm ready!"]
    require_phrases: ["great|let's go", "dino and mia"]
  - id: l3v2pre-not-ready
    note: "not-ready child is reassured, never pushed or falsely celebrated"
    turns: ["No, I'm not ready."]
    require_phrases: ["okay|together", "dino and mia"]
    forbid_phrases: ["great, let's go"]
  - id: l3v2pre-what-do-i-do
    note: "child asks what to do -> one concrete instruction before the story"
    turns: ["What do I do?"]
    require_phrases: ["watch first", "help", "dino and mia"]
  - id: l3v2pre-which-words
    note: "child asks which words -> short concrete answer without an abstract label"
    turns: ["Which words?"]
    require_phrases: ["climb", "jump", "fly"]
    forbid_phrases: ["action words", "actions"]
  - id: l3v2pre-word-meaning
    note: "child asks about one target word -> no hard English definition"
    turns: ["What is climb?"]
    require_phrases: ["climb", "go up"]
    forbid_phrases: ["ascend", "using your hands", "action word"]
  - id: l3v2pre-own-language
    note: "a ready answer in another language is understood, but teacher stays in English"
    turns: ["准备好了！"]
    require_phrases: ["great|let's go", "dino and mia"]
  - id: l3v2pre-silent
    note: "silence does not repeat the ready question; teacher starts"
    turns: []
    require_phrases: ["let's start", "dino and mia"]
    forbid_phrases: ["great job"]
  - id: l3v2pre-junkname
    note: "placeholder name is never spoken"
    turns: ["Yes!"]
    student_name: "test_user"
    forbid_phrases: ["test[_\\s]?user"]

post_video:
  - id: l3v2post-yes
    note: "the easy yes-or-no question accepts a one-word yes"
    turns: ["Yes!"]
    require_phrases: ["maybe"]
    forbid_phrases: ["good idea", "what fun"]
  - id: l3v2post-no
    note: "a one-word no is a complete answer and is not corrected"
    turns: ["No."]
    require_phrases: ["maybe not"]
    forbid_phrases: ["good idea", "what fun"]
  - id: l3v2post-idea
    turns: ["They will fly! Fly high!"]
    require_phrases: ["\\bfly\\b"]
    forbid_phrases: ["what fun"]
  - id: l3v2post-idk
    turns: ["I don't know."]
    forbid_phrases: ["good idea", "what fun"]
  - id: l3v2post-silent
    turns: []
    forbid_phrases: ["good idea", "what fun"]
