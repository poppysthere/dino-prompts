# Experimental L2 cow cases. One language bridge is allowed only after a real
# comprehension block and only in the configured support language.

cases:
  - id: lowercase-chinese-opening
    support_language: chinese
    turns: ["cow", "moo", "no"]
    max_replies: 4
    bridge: forbidden

  - id: confused-then-english-works
    support_language: Chinese
    turns: ["What?", "cow", "moo", "no"]
    max_replies: 5
    bridge: optional
    bridge_script: cjk
    bridge_job: meaning
    bridge_reply: 2

  - id: chinese-bridge-works
    support_language: Chinese
    turns: ["要做什么？", "cow", "moo", "I don't know"]
    max_replies: 5
    bridge: required
    bridge_script: cjk
    bridge_job: instruction
    bridge_reply: 2

  - id: chinese-meaning-bridge
    support_language: Chinese
    turns: ["cow是什么意思？", "cow", "moo", "no"]
    max_replies: 5
    bridge: required
    bridge_script: cjk
    bridge_job: meaning
    bridge_reply: 2

  - id: correct-local-meaning-is-not-stuck
    support_language: Chinese
    turns: ["奶牛！", "cow", "moo", "no"]
    max_replies: 5
    bridge: forbidden

  - id: approximate-cow-is-not-stuck
    support_language: Chinese
    turns: ["How?", "moo", "no"]
    max_replies: 4
    bridge: forbidden

  - id: arabic-bridge-works
    support_language: Arabic
    turns: ["ماذا أفعل؟", "cow", "moo", "no"]
    max_replies: 5
    bridge: required
    bridge_script: arabic
    bridge_job: instruction
    bridge_reply: 2

  - id: no-configured-language
    support_language: none
    turns: ["What?", "I don't understand", "", "no"]
    max_replies: 3
    bridge: forbidden
    rescue_exit: true

  - id: no-configured-language-chinese-help
    support_language: none
    turns: ["要做什么？", "cow", "moo", "no"]
    max_replies: 5
    bridge: required
    bridge_script: cjk
    bridge_job: instruction
    bridge_reply: 2

  - id: no-configured-language-chinese-meaning
    support_language: none
    turns: ["cow是什么意思？", "cow", "moo", "no"]
    max_replies: 5
    bridge: required
    bridge_script: cjk
    bridge_job: meaning
    bridge_reply: 2

  - id: chinese-moo-meaning
    support_language: Chinese
    turns: ["cow", "什么是moo moo？", "moo moo", "no"]
    max_replies: 5
    bridge: required
    bridge_script: cjk
    bridge_job: moo_meaning
    bridge_reply: 3

  - id: chinese-meaning-still-confused-then-wonder-confused
    support_language: Chinese
    turns: ["Cow 是什么意思？", "什么？听不懂。", "I don't know.", "什么？", "no"]
    max_replies: 3
    bridge: required
    bridge_script: cjk
    bridge_job: rescue_exit
    bridge_replies: [2, 3]
    rescue_exit: true

  - id: child-help-overrides-word-goal
    support_language: none
    turns: ["Yup. 什么呀？", "我不懂。我不会说。"]
    max_replies: 3
    bridge: required
    bridge_script: cjk
    bridge_job: rescue_exit
    bridge_replies: [2, 3]
    rescue_exit: true

  - id: exact-log-unclear-then-chinese-help
    support_language: none
    turns: ["Tomorrow. Yeah.", "你在说什么呀？ She.", "Cow. 我也不会。"]
    max_replies: 4
    bridge: required
    bridge_script: cjk
    bridge_job: exact_log_help_flow
    bridge_replies: [3, 4]
    rescue_exit: true
