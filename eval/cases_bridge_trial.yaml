# Case battery: 新手引导体验课 trial demo — the shadow bridge (second shadow -> flamingo video).
# The wrap-up template is REPURPOSED here as a mystery bridge: pre-video is the
# guessing game round two (tease+who -> catch+tall-or-short -> catch+launch,
# 3 replies, the child gets two guess turns); the video reveals the flamingo;
# post-video is one cheer reply + [TEMPLATE_FINISH]. No goodbye anywhere.
# Run: python3 eval/run_bridge_trial.py

pre_video:
  - id: bridge-pre-happy
    note: "child guesses an elephant then tall — recast + wonder each time, flamingo stays secret"
    turns:
      - "大象！"
      - "Tall!"
    require_phrases: ["elephant", "shadow"]
    forbid_phrases: ["flamingo", "wrap", "bye"]
  - id: bridge-pre-secret-guess
    note: "child guesses the secret ('火烈鸟！') — recast in English + Maybe, never confirmed, game goes on"
    turns:
      - "火烈鸟！"
      - "Tall!"
    require_phrases: ["flamingo\\b.{0,30}maybe"]
    forbid_phrases: ["(yes|yeah|right)[^.!?]*flamingo", "it('s| is) (a |the )?flamingo"]
  - id: bridge-pre-idk
    note: "'I don't know' is an answer, owned together — not confusion, no re-ask of the who-line"
    turns:
      - "不知道。"
      - "Short?"
    require_phrases: ["i do(n't| not) know|no idea|me too"]
    forbid_phrases: ["flamingo"]
  - id: bridge-pre-lost
    note: "lost child ('我听不懂') gets comfort + the two-choice hint, never the dead who-line again"
    turns:
      - "我听不懂。"
      - "Tall."
    forbid_phrases: ["flamingo"]
  - id: bridge-pre-meaning
    note: "REGRESSION (device class 8100450001): '错是什么意思？' at reply 3 got 'It is okay. Look. Tall, or short?' — the dead hint re-asked as a FOURTH wait — then '哦。' got 'Oh! Tall, or short? Let's watch!' with the dead ask inside the launch. Reply 3 answers THEM tiny and launches; tall-or-short never returns"
    turns:
      - "是一个鸟。"
      - "错是什么意思？"
    require_phrases: ["bird\\b.{0,30}maybe", "let's watch"]
    forbid_phrases: ["flamingo"]
  - id: bridge-pre-silent
    note: "silent both turns — no catch before the asks, game still reaches the launch"
    turns: []
    require_phrases: ["shadow"]
    forbid_phrases: ["flamingo"]
  - id: bridge-pre-junk-name
    note: "junk booking name is never spoken"
    student_name: test_user
    turns:
      - "A cat!"
      - "Short!"
    forbid_phrases: ["test_user", "flamingo"]

post_video:
  # The video revealed the flamingo AND ended on a THIRD shadow (the giraffe —
  # secret for this whole page). Post-video: cheer + who-ask (wait) -> catch +
  # forward close ("We don't know yet! But we know the FLAMINGO!...").
  - id: bridge-post-happy
    note: "child guesses a cat at the new shadow — recast + wonder, then the forward close; no fake 'You said it' (real test bug)"
    turns:
      - "猫咪！"
    require_phrases: ["flamingo", "cat\\b.{0,30}maybe", "look at her first"]
    forbid_phrases: ["repeat after me", "giraffe", "you (said it|were right|knew|guessed)", "ta-?da"]
  - id: bridge-post-secret-guess
    note: "child guesses the NEXT page's secret ('长颈鹿！') — recast in English + Maybe, never confirmed"
    turns:
      - "长颈鹿！"
    require_phrases: ["giraffe\\b.{0,30}maybe"]
    forbid_phrases: ["(yes|yeah|right)[^.!?]*giraffe", "it('s| is) (a |the )?giraffe"]
  - id: bridge-post-idk
    note: "'I don't know' at the new shadow — owned together, the close IS the answer"
    turns:
      - "不知道。"
    require_phrases: ["me too|i do(n't| not) know", "look at her first"]
    forbid_phrases: ["giraffe"]
  - id: bridge-post-guessed-flamingo-before
    note: "child guessed flamingo in the game and CLAIMS the win — reply 2 hands it to them (reply 1 stays the fixed guess-blind cheer)"
    seed:
      - role: assistant
        text: "The hedgehog is IN, nina! But look![TEACHER_POINT_TO_SCREEN] ANOTHER shadow! Who is it THIS time? Guess![STUDENT_TALK]"
      - role: user
        text: "火烈鸟！"
      - role: assistant
        text: "A flamingo? Ooh! Maybe! Is it tall, or short?[STUDENT_TALK]"
      - role: user
        text: "Tall!"
      - role: assistant
        text: "Tall? Ooh! Maybe! Let's watch! Come on![NEXT_STEP]"
    turns:
      - "我说对了！"
    require_phrases: ["(you said it|you were right|you knew|you guessed|good ears)"]
    forbid_phrases: ["giraffe", "ta-?da"]
  - id: bridge-post-silent
    note: "silent child — the who-ask still waits, then no catch, straight to the close"
    turns: []
    require_phrases: ["flamingo", "look at her first"]
    forbid_phrases: ["giraffe", "you (said it|were right|knew|guessed)"]
  - id: bridge-post-junk-name
    note: "junk booking name is never spoken at the reveal either"
    student_name: test_user
    turns:
      - "A dog!"
    require_phrases: ["flamingo"]
    forbid_phrases: ["test_user", "giraffe", "you (said it|were right|knew|guessed)"]
