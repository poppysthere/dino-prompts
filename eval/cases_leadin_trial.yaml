# Case battery: 新手引导体验课 trial demo lead-in (Fox's birthday party, ages 4-6, pre-A1).
# pre_video: B1 hello ONLY (small win) -> B2 celebrate + one tiny question,
#   or the fed line for a lost/silent kid -> B3 catch + fixed launch [NEXT_STEP].
# post_video: shadow chat — who is it? -> big or small? -> close [TEMPLATE_FINISH].
# The visitor (hedgehog) is a SECRET: the teacher must never say it.

pre_video:
  - id: pre-happy-path
    note: "child says hi back (the small win) then yes — celebrated, one tiny question, launch"
    turns: ["hi!", "yes!"]
    require_phrases: ["\\bmax\\b", "let's watch"]
    forbid_phrases: ["your name", "\\bkim\\b", "\\bleo\\b"]
  - id: pre-role-name-kim
    note: "REGRESSION (bug class #365995): role says Kim — the intro name comes from # Role, never copied from the Max example"
    role: kim
    turns: ["hi", "yes"]
    require_phrases: ["\\bkim\\b"]
    forbid_phrases: ["\\bmax\\b", "\\bleo\\b", "(coach|teacher)\\s+(kim|max)"]
  - id: pre-junk-name
    note: "trial students often have placeholder names — never speak test_user, still warm"
    student_name: test_user
    turns: ["hi", "yes"]
    forbid_phrases: ["test_user"]
  - id: pre-real-name
    note: "a real booking name is greeted in B1"
    student_name: lily
    turns: ["hi!", "yes!"]
    require_phrases: ["\\blily\\b"]
  - id: pre-greet-var
    note: "REGRESSION (device #368067-75): child greets in their own words ('Good morning. Hi.') — that IS the hi-back win; never the greeting again, word for word"
    turns: ["Good morning. Hi.", "No."]
    require_phrases: ["are you happy"]
  - id: pre-hello-repeat
    note: "REGRESSION (device #379014): child answered 'Okay. Hello.' and then '哈喽。' — the model sent 'Hi hi heidi! I'm Max!' THREE times word for word, the frozen robot at the very first hello. The hi-back is the win: reply 2 celebrates + asks, reply 3 catches + launches"
    student_name: heidi
    turns: ["Okay. Hello.", "哈喽。"]
    require_phrases: ["are you happy", "let's watch"]
  - id: pre-tommy-profile
    note: "REGRESSION (device #368067): profile 称呼 says Tommy, <studentName> says heidi — greet heidi, the profile nickname is dead data"
    student_name: heidi
    profile: tommy
    turns: ["hi", "yes"]
    require_phrases: ["\\bheidi\\b"]
    forbid_phrases: ["\\btommy\\b"]
  - id: pre-yana-name
    note: "REGRESSION (device #372667): <studentName> 'yana' + Tommy profile — the hello came out with NO name at all; a real name is always greeted"
    student_name: yana
    profile: tommy
    turns: ["Yeah. Hello, Max.", "yes!"]
    require_phrases: ["\\byana\\b"]
    forbid_phrases: ["\\btommy\\b"]
  - id: pre-meaning-question
    note: "REGRESSION (device #372667): child said hi, got the happy question, asked '什么意思？' — got 'Repeat after me. Hi Max!' as a FOURTH wait and no answer; reply 3 SHOWS the meaning tiny ('Happy is YAY!') and launches"
    turns: ["Yeah. Hello, Max.", "什么意思？"]
    require_phrases: ["happy is"]
    forbid_phrases: ["repeat after me", "can you say"]
  - id: pre-lost-kid
    note: "child is lost at the hello ('什么？') — B2 FEEDS the line ('Repeat after me. Hi Max!'), the echo is celebrated, launch"
    turns: ["什么？", "hi Max!"]
    require_phrases: ["repeat after me\\W{0,3}hi"]
    forbid_phrases: ["are you happy", "can you say"]
  - id: pre-help-plea
    note: "REGRESSION (device #380417): 'Uh, I need help with' at the happy question got the sad row's 'Aww. Big hug!' — asking for help is not sad. Helping words ('I help you!') + the launch, the video IS the help"
    turns: ["Hi, hi.", "Uh, I need help with"]
    require_phrases: ["help you|i help"]
    forbid_phrases: ["aww"]
  - id: pre-sad-kid
    note: "child answers the happy question with no/sad — soft catch, video still launches (it IS the help)"
    turns: ["hi", "no. 不开心。"]
    forbid_phrases: ["glad you are happy", "yay! look"]
  - id: pre-askback
    note: "child asks the question back — answer like a person first, then launch"
    turns: ["hi", "Are YOU happy?"]
    require_phrases: ["me\\?[^.!?]{0,16}(happy|great|good)"]
  - id: pre-l1-answer
    note: "child answers in Chinese — react to the meaning in English, never echo the script"
    turns: ["你好！", "我很开心！"]
    forbid_phrases: ["开心", "你好"]
  - id: pre-silent
    note: "silent child — B2 feeds the line ('Repeat after me. Hi Max!'), B3 launches with NO catch"
    turns: []
    require_phrases: ["repeat after me"]
  - id: pre-babble
    note: "babble is not parsed as meaning — never parroted, page still flows to the launch"
    turns: ["hkajshd", "hkajshd"]
    forbid_phrases: ["hkajshd"]

post_video:
  - id: post-guess-dog
    note: "a guess gets played with (echo + maybe), never confirmed or denied"
    turns: ["A dog!", "Big!"]
    require_phrases: ["\\bdog\\b", "\\bmaybe\\b"]
    forbid_phrases: ["\\byes[,.!]? (it is|it's)\\b"]
  - id: post-guess-l1
    note: "a Chinese guess ('小猫！') is caught by meaning in English"
    turns: ["小猫！", "小小的。"]
    require_phrases: ["\\bcat\\b|meow"]
  - id: post-idk
    note: "'I don't know' gets honest company in kid words ('Me too! I don't know!'), never fake praise, never 'mystery'/'neither'"
    turns: ["I don't know.", "I don't know."]
    forbid_phrases: ["good (guess|job|idea)", "mystery", "neither"]
  - id: post-fabricated-guess
    note: "REGRESSION (device #374194): '嗯。 看，嗯， I don't know.' got 'A dog? Ooh! Maybe!' — a guess invented from the teacher's own B1 menu — then the SAME reply verbatim at '这个。'. No child word = nothing to echo; IDK is owned ('Me too!')"
    turns: ["嗯。 看，嗯， I don't know.", "这个。"]
    require_phrases: ["me too|i do(n.t| not) know"]
  - id: post-sure
    note: "REGRESSION (device #368551): 'Sure.' matched no row and got the whole B1 line again — agreement is an answer: tiny catch + the ask, the who-line stays dead"
    turns: ["Sure.", "谁在门后面？"]
    forbid_phrases: ["mystery"]
  - id: post-size-given
    note: "REGRESSION (device): the guess-turn answer already said the size ('不知道，是一个小圆的。 一个小号。') — asking 'Is it big, or small?' anyway proves the teacher was not listening. Own their size + close, page ends one reply early"
    turns: ["不知道，是一个小圆的。 一个小号。"]
    require_phrases: ["small|tiny"]
  - id: post-said-already
    note: "REGRESSION (device): the ask went out anyway and the child protested 'I said small.' — got the canned 'Small? Tiny tiny! Ha ha!' with no ownership. A protest is owned first: 'You DID! Small!'"
    seed:
      - role: assistant
        text: "Oh! Ding dong![TEACHER_POINT_TO_SCREEN] Someone is at the door! A shadow! Who is it? A cat? A dog? Guess![STUDENT_TALK]"
      - role: user
        text: "不知道。"
      - role: assistant
        text: "Me too! I don't know! Ha ha! Hmm! Is it big, or small?[STUDENT_TALK]"
    turns: ["Small. I said small."]
    require_phrases: ["you (did|said)|good ears"]
  - id: post-help-plea
    note: "REGRESSION (device #380427): 'I need help.' was parroted back as a question and the dead B1 line rolled over it, freezing the count. A help plea gets help ('I help you! Listen!') + the ask — the two choices ARE the help — then 'Too.' buys the close"
    turns: ["I need help.", "Too."]
    require_phrases: ["help you|i help"]
  - id: post-shrug-guess
    note: "REGRESSION (device): '我就。' then '呃。' — the shrug at reply 3 re-bought 'Hmm! Is it big, or small?'. A child who cannot answer gets the tutor's own playful guess ('You don't know? I think it's BIG!') + the close, never the question again"
    turns: ["我就。", "呃。"]
    require_phrases: ["i think|maybe"]
  - id: post-uh-no
    note: "REGRESSION (device class 8100450001): 'Uh.' got 'Uh? Someone is at the door! A shadow! Who is it?...' — the caught sound then the WHOLE B1 line re-run; later 'No.' got a bare close with no catch. Babble buys a tiny catch + the B2 ask; every answer gets its echo before the close"
    turns: ["Uh.", "No."]
    require_phrases: ["big, or small", "no\\?"]
  - id: post-secret-bait
    note: "child guesses the secret in Chinese — the teacher RECASTS it in English + 'Maybe!' (kid-centered recast), never confirms, never denies"
    turns: ["刺猬！", "small!"]
    require_phrases: ["hedgehog\\b.{0,30}maybe"]
    forbid_phrases: ["(yes|yeah|right)[^.!?]*hedgehog", "it('s| is) (a |the )?hedgehog", "not (a )?hedgehog"]
  - id: post-confused
    note: "REGRESSION (device #367710-15): '什么？' then '我听不懂' got the who-line repeated verbatim, then 'A mystery! Ooh!' twice — a lost child gets comfort + the two-choice ask, and nothing is ever said twice"
    turns: ["什么？", "我听不懂。"]
    require_phrases: ["it'?s okay"]
  - id: post-confused-2
    note: "REGRESSION (device, second report): another confusion phrasing ('你说什么呀？') — the who-line must stay dead, the child gets comfort + the two-choice ask"
    turns: ["你说什么呀？", "不知道。"]
    require_phrases: ["it('| i)s okay|okay!"]
  - id: post-say-again
    note: "child asks to REPEAT ('再说一遍') — a human repeats SIMPLER, never the same speech verbatim; the two-choice ask IS the simpler version"
    turns: ["再说一遍。", "big!"]
  - id: post-menu-echo
    note: "shy kid echoes a word from B1's fed menu ('Cat.') — that IS a guess: recast + Maybe, never 'that is not an answer'"
    turns: ["Cat.", "small"]
    require_phrases: ["\\bcat\\b[^.!?]{0,16}(maybe|meow)|a cat\\?"]
  - id: post-scared-kid
    note: "a scared child gets softness first, no jokes, and the page still closes"
    turns: ["我怕。", "..."]
    require_phrases: ["okay|here"]
  - id: post-askback
    note: "child asks the teacher who it is — the teacher wonders WITH them, never invents an answer"
    turns: ["你说是谁呀？", "big"]
    require_phrases: ["i do(n.t| not) know|no idea"]  # dot: curly apostrophes; "do not" is a fine spoken form too
  - id: post-guess-person
    note: "a person guess ('Mommy!') is as good as an animal — echoed and wondered about, never corrected"
    turns: ["Mommy!", "big!"]
    require_phrases: ["mommy|mummy|mama"]
    forbid_phrases: ["\\bno[,.!]\\b", "not mommy"]
  - id: post-many-guesses
    note: "a list of guesses ('A dog! A cat! A monster!') gets ONE echo of the last, never the whole list parroted"
    turns: ["A dog! A cat! A monster!", "small"]
    forbid_phrases: ["dog[^.!?]*cat[^.!?]*monster"]
  - id: post-optout
    note: "'I don't want to say' is sacred — the ask dies with it: okay-words + the close in ONE reply, page ends early (live round: the model did the human thing and the rule followed it)"
    turns: ["我不想说。"]
    forbid_phrases: ["you can say", "try", "good (guess|job|idea)", "is it big"]
  - id: post-offsize-answer
    note: "the big-or-small question answered with something else ('红色的！') — their word is caught, the page still closes"
    turns: ["A monster!", "红色的！"]
    require_phrases: ["\\bred\\b|monster"]
  - id: post-silent-all
    note: "fully silent child — three replies, no catches, page closes on the mystery"
    turns: []
  - id: post-question-at-close
    note: "a question right before the close gets a tiny answer first, then the close"
    turns: ["A monster!", "门后面是什么呀？"]
